
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Contact Us</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Events Hub</h1>
  </header>

  <main>
    <section id="address">
      <h2>College Address</h2>
      <p>Jigme Namgyel Engineering College, Dewathang, Bhutan</p>
    </section>

    <section id="contact-info">
      <h2>Get in Touch</h2>
      <p>Email: <a href="mailto:info@jnec.edu.bt">info@jnec.edu.bt</a></p>
      <p>Phone: +975-07-260-302</p>
    </section>

    <section id="map">
      <h2>Find Us</h2>
      <iframe src="https://www.google.com/maps/embed?..."></iframe>
    </section>

    <section id="enquiry">
      <h2>Enquiry Form</h2>
      <form action="#" method="post">
        <label>Name: <input type="text" name="name"></label><br>
        <label>Email: <input type="email" name="email"></label><br>
        <label>Message:<br><textarea name="message"></textarea></label><br>
        <input type="submit" value="Submit">
      </form>
    </section>
  </main>
</body>
</html>
